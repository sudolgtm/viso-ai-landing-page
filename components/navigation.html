<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../style.css" />
    <link href="./navigation.css" rel="stylesheet" />
    <title>Navigation</title>
  </head>
  <body>
    <div class="navigation-container1">
      <nav class="navigation-wrapper">
        <div class="navigation-container">
          <a href="#hero">
            <div class="navigation-logo-link">
              <div class="navigation-logo-icon">
                <img src="public/logos/viso_icon_128x128.png" srcset="public/logos/viso_icon_128x128.png 1x, public/logos/viso_icon_256x256.png 2x" alt="Viso logo" class="navigation-logo-img" />
              </div>
              <span class="navigation-brand section-title">Viso</span>
            </div>
          </a>
          <div class="navigation-desktop-menu">
            <a href="#features"><div class="navigation-link"><span>Features</span></div></a>
            <a href="#how-it-works"><div class="navigation-link"><span>How it Works</span></div></a>
            <a href="#pricing"><div class="navigation-link"><span>Pricing</span></div></a>
            <a href="#hero"><div class="btn btn-primary btn-sm"><span>Start Free Trial</span></div></a>
          </div>
          <button id="navigationToggle" aria-label="Toggle Menu" aria-expanded="false" class="navigation-mobile-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>
      </nav>

      <div id="navigationOverlay" class="navigation-overlay">
        <div class="navigation-overlay-header">
          <a href="#hero">
            <div class="navigation-logo-link">
              <div class="navigation-logo-icon">
                <img src="public/logos/viso_icon_128x128.png" alt="Viso logo" class="navigation-logo-img" />
              </div>
              <span class="navigation-brand section-title">Viso</span>
            </div>
          </a>
          <button id="navigationClose" aria-label="Close Menu" class="navigation-mobile-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 16l3-3l3 3"></path></g></svg>
          </button>
        </div>
        <div class="navigation-overlay-content">
          <div class="navigation-overlay-links">
            <a href="#features"><div class="navigation-overlay-link"><span>Features</span></div></a>
            <a href="#how-it-works"><div class="navigation-overlay-link"><span>How it Works</span></div></a>
            <a href="#pricing"><div class="navigation-overlay-link"><span>Pricing</span></div></a>
          </div>
          <div class="navigation-overlay-footer">
            <a href="#hero"><div class="navigation-thq-btn-elm2 btn btn-primary btn-xl"><span>Start Free Trial</span></div></a>
            <p class="navigation-thq-section-content-elm section-content">No credit card required</p>
          </div>
        </div>
      </div>

    </div>

    <script defer data-name="navigation-logic">
      document.addEventListener('DOMContentLoaded', function() {
        (function(){
          const toggleBtn = document.getElementById("navigationToggle")
          const closeBtn = document.getElementById("navigationClose")
          const overlay = document.getElementById("navigationOverlay")
          const body = document.body

          const openMenu = () => {
            overlay.classList.add("active")
            toggleBtn.setAttribute("aria-expanded", "true")
            body.style.overflow = "hidden"
          }

          const closeMenu = () => {
            overlay.classList.remove("active")
            toggleBtn.setAttribute("aria-expanded", "false")
            body.style.overflow = ""
          }

          toggleBtn.addEventListener("click", openMenu)
          if (closeBtn) closeBtn.addEventListener("click", closeMenu)

          const overlayLinks = document.querySelectorAll(".navigation-overlay-link")
          overlayLinks.forEach((link) => {
            link.addEventListener("click", closeMenu)
          })

          window.addEventListener("resize", () => {
            if (window.innerWidth > 767 && overlay.classList.contains("active")) {
              closeMenu()
            }
          })

          window.addEventListener("scroll", () => {
            const currentScroll = window.pageYOffset
            const nav = document.querySelector(".navigation-wrapper")

            if (currentScroll > 100) {
              nav.style.padding = "var(--spacing-md) 0"
              nav.style.boxShadow = "0 10px 30px -10px rgba(0,0,0,0.1)"
            } else {
              nav.style.padding = "var(--spacing-lg) 0"
              nav.style.boxShadow = "none"
            }
          })
        })()
      });
    </script>
  </body>
</html>
