            <script defer="" data-name="navigation-logic">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const toggleBtn = document.getElementById("navigationToggle")
                  const closeBtn = document.getElementById("navigationClose")
                  const overlay = document.getElementById("navigationOverlay")
                  const body = document.body

                  const openMenu = () => {
                    overlay.classList.add("active")
                    toggleBtn.setAttribute("aria-expanded", "true")
                    body.style.overflow = "hidden"
                  }

                  const closeMenu = () => {
                    overlay.classList.remove("active")
                    toggleBtn.setAttribute("aria-expanded", "false")
                    body.style.overflow = ""
                  }

                  toggleBtn.addEventListener("click", openMenu)
                  closeBtn.addEventListener("click", closeMenu)

                  const overlayLinks = document.querySelectorAll(".navigation-overlay-link")
                  overlayLinks.forEach((link) => {
                    link.addEventListener("click", closeMenu)
                  })

                  window.addEventListener("resize", () => {
                    if (window.innerWidth > 767 && overlay.classList.contains("active")) {
                      closeMenu()
                    }
                  })

                  let lastScroll = 0
                  window.addEventListener("scroll", () => {
                    const currentScroll = window.pageYOffset
                    const nav = document.querySelector(".navigation-wrapper")

                    if (currentScroll > 100) {
                      nav.style.padding = "var(--spacing-sm) 0"
                      nav.style.boxShadow = "0 10px 30px -10px rgba(0,0,0,0.1)"
                    } else {
                      nav.style.padding = "var(--spacing-md) 0"
                      nav.style.boxShadow = "none"
                    }

                    lastScroll = currentScroll
                  })
                })()
              });
            </script>
